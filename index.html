<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KundalikY</title>
<meta name="theme-color" content="#f7f5f0">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loader" class="loader">Yuklanmoqda...</div>

<!-- AUTH SCREEN -->
<div id="authScreen" class="center-screen hidden">
  <h1 class="serif">KundalikY</h1>
  <p>Hayotingizni besh yo'nalishda balansda ushlab turing: Biznes, Bilim, Oila, Sport va Qiziqishlar. Oylik maqsad &rarr; haftalik reja &rarr; kunlik harakat.</p>
  <button class="btn primary" id="googleSignInBtn">Google orqali kirish</button>
  <button class="btn ghost" id="guestSignInBtn">Mehmon sifatida davom etish</button>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden">

  <div id="mainScreen">
    <div class="topbar">
      <h1 class="serif" id="viewTitle">Kunlik</h1>
    </div>
    <div class="date-nav">
      <button id="prevBtn">&#8249;</button>
      <div class="date-label" id="dateLabelText"></div>
      <button id="nextBtn">&#8250;</button>
    </div>
    <div id="content"></div>
  </div>

  <div id="settingsScreen" class="hidden">
    <div class="topbar"><h1 class="serif">Sozlamalar</h1></div>

    <div class="section-title">Ko'rinish</div>
    <div class="settings-row">
      <span>Tungi rejim</span>
      <button class="switch" id="darkSwitch"></button>
    </div>

    <div class="section-title">Tizim</div>
    <div class="settings-row">
      <span>Keshni tozalash</span>
      <button class="btn ghost" style="width:auto;margin:0;padding:8px 14px;" id="clearCacheBtn">Tozalash</button>
    </div>
    <div class="settings-row">
      <span>Chiqish</span>
      <button class="btn ghost" style="width:auto;margin:0;padding:8px 14px;color:var(--danger);" id="signOutBtn">Chiqish</button>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active" data-view="kunlik">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span>Kunlik</span>
    </button>
    <button class="nav-item" data-view="haftalik">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Haftalik</span>
    </button>
    <button class="nav-item" data-view="oylik">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.8" fill="currentColor"/></svg>
      <span>Oylik</span>
    </button>
    <button class="nav-item" data-view="sozlamalar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009.6 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9.6a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <span>Sozlama</span>
    </button>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
